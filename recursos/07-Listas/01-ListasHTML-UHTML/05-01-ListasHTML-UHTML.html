<!DOCTYPE html>
<!-- La línea anterior declara que el documento usa HTML5 -->
<!-- Elemento raíz; lang indica el idioma del contenido -->
<html lang="en">
<!-- head: información de la página que no se muestra directamente -->
<head>
    <!-- Codificación de caracteres (permite acentos y ñ) -->
    <meta charset="UTF-8">
    <!-- Pide a Internet Explorer usar su motor de renderizado más reciente -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Ajusta el ancho de la página al de la pantalla (diseño responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Listas en HTML</title>
</head>
<!-- body: contenido visible de la página -->
<body>
    <!-- Encabezado principal (nivel 1) -->
    <h1>Listas No Ordenadas</h1>
    <!-- Lista desordenada (con viñetas) y estilo en línea (atributo style) -->
    <ul style="list-style-type: square;">
        <!-- Elemento de la lista -->
        <li>Juan
            <!-- Lista desordenada (con viñetas) -->
            <ul>
                <li>Tel. 44330011</li>
                <li>Cel. 99881122</li>
            </ul>
        </li>
        <li>Karla</li>
        <li>María</li>
        <li>Carlos
            <!-- Lista desordenada (con viñetas) -->
            <ul>
                <li>Tel. 55443399</li>
                <li>Cel. 55668811</li>
            </ul>
        </li>
    </ul>
</body>
</html>
