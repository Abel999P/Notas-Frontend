<!DOCTYPE html>
<!-- La línea anterior declara que el documento usa HTML5 -->
<!-- Elemento raíz; lang indica el idioma del contenido -->
<html lang="en">
<!-- head: información de la página que no se muestra directamente -->
<head>
    <!-- Codificación de caracteres (permite acentos y ñ) -->
    <meta charset="UTF-8">
    <!-- Pide a Internet Explorer usar su motor de renderizado más reciente -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Ajusta el ancho de la página al de la pantalla (diseño responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Bordes en CSS</title>
    <!-- Vincula la hoja de estilos externa css/estilos.css -->
    <link href="css/estilos.css" rel="stylesheet"/>
</head>
<!-- body: contenido visible de la página -->
<body>
    <!-- Encabezado principal (nivel 1) -->
    <h1>Borders en CSS</h1>
    <!-- Párrafo con la clase "punteado" -->
    <p class="punteado">Borde punteado</p>
    <!-- Párrafo con la clase "discontinuo" -->
    <p class="discontinuo">Borde discontinuo</p>
    <!-- Párrafo con la clase "solido" -->
    <p class="solido">Borde sólido</p>
    <!-- Párrafo con la clase "doble" -->
    <p class="doble">Borde doble</p>
    <!-- Párrafo con la clase "surco" -->
    <p class="surco">Borde con surco</p>
    <!-- Párrafo con la clase "cresta" -->
    <p class="cresta">Borde con cresta</p>
    <!-- Párrafo con la clase "recuadro" -->
    <p class="recuadro">Borde con recuadro</p>
    <!-- Párrafo con la clase "outset" -->
    <p class="outset">Borde outset</p>
    <!-- Párrafo con la clase "sin_borde" -->
    <p class="sin_borde">Sin borde</p>
    <!-- Párrafo con la clase "oculto" -->
    <p class="oculto">Borde oculto</p>
    <!-- Párrafo con la clase "mixto" -->
    <p class="mixto">Borde mixto</p>
</body>
</html>
