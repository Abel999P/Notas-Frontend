<!DOCTYPE html>
<!-- La línea anterior declara que el documento usa HTML5 -->
<!-- Elemento raíz; lang indica el idioma del contenido -->
<html lang="en">
<!-- head: información de la página que no se muestra directamente -->
<head>
    <!-- Codificación de caracteres (permite acentos y ñ) -->
    <meta charset="UTF-8">
    <!-- Pide a Internet Explorer usar su motor de renderizado más reciente -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Ajusta el ancho de la página al de la pantalla (diseño responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Contacto</title>
</head>
<!-- body: contenido visible de la página -->
<body>
    <!-- Encabezado principal (nivel 1) -->
    <h1>Contacto GlobalMentoring.com.mx</h1>
    <!-- Línea horizontal de separación -->
    <hr/>
    <!-- Párrafo -->
    <p>Página de Contacto</p>
    <!-- Link a un sitio externo (ruta absoluta); target="_blank" lo abre en una pestaña nueva -->
    <a href="http://www.facebook.com/globalmentoring" target="_blank">
        Facebook de GlobalMentoring.com.mx
    </a>
    <!-- Salto de línea -->
    <br/><br/>
    <!-- Link a index.html (ruta relativa) -->
    <a href="index.html">Inicio</a>
</body>
</html>
