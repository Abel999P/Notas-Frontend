<!DOCTYPE html>
<!-- La línea anterior declara que el documento usa HTML5 -->
<!-- Elemento raíz; lang indica el idioma del contenido -->
<html lang="en">
<!-- head: información de la página que no se muestra directamente -->
<head>
    <!-- Codificación de caracteres (permite acentos y ñ) -->
    <meta charset="UTF-8">
    <!-- Pide a Internet Explorer usar su motor de renderizado más reciente -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Ajusta el ancho de la página al de la pantalla (diseño responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Links HTML</title>
    <!-- Vincula la hoja de estilos externa que da formato a los links -->
    <link href="css/estilos.css" rel='stylesheet'/>
</head>
<!-- body: contenido visible de la página -->
<body>
    <!-- Encabezado principal -->
    <h1>Universidad HTML</h1>
    <!-- Salto de línea -->
    <br/>
    <!-- Link de texto con ruta relativa a otra página del mismo sitio -->
    <a href="contenido.html">Ir a contenido</a>
    <br/>
    <!-- Link con imagen: el <img> va dentro del <a>, así la imagen es clicable.
         target="_blank" abre el sitio en una nueva pestaña -->
    <a href="http://globalmentoring.com.mx" target="_blank">
        <!-- src: ruta (absoluta) de la imagen; alt: texto alternativo si no carga.
             style: estilo en línea que fija el ancho y alto de la imagen -->
        <img src="http://globalmentoring.com.mx/imagenes/gm.png" alt='Logo GM'
        style="width: 150px;height: 74px;"/>
    </a>
</body>
</html>
