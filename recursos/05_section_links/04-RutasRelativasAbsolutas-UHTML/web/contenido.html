<!DOCTYPE html>
<!-- Página dentro de la subcarpeta web; se llega desde el link "Ir a contenido" de index.html -->
<html lang="en">
<head> 
    <!-- Codificación de caracteres -->
    <meta charset="UTF-8">
    <!-- Compatibilidad con Internet Explorer -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Ajuste al ancho de la pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título de la pestaña -->
    <title>Contenido</title>
    <!-- "/css/estilos.css" parte de la raíz del sitio, por eso encuentra la carpeta css
         aunque este archivo esté dentro de web/ (con ruta relativa sería "../css/estilos.css") -->
    <link href="/css/estilos.css" rel='stylesheet'/>
</head>
<body>
    <!-- Encabezado de la página -->
    <h1>Contenido</h1>
    <!-- Link de regreso a la página de inicio, también desde la raíz del sitio -->
    <a href="/index.html">Inicio</a>
</body>
</html>
