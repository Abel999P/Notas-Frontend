<!DOCTYPE html>
<!-- La línea anterior declara que el documento usa HTML5 -->
<!-- Elemento raíz; lang indica el idioma del contenido -->
<html lang="en">
<!-- head: información de la página que no se muestra directamente -->
<head>
    <!-- Codificación de caracteres (permite acentos y ñ) -->
    <meta charset="UTF-8">
    <!-- Pide a Internet Explorer usar su motor de renderizado más reciente -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Ajusta el ancho de la página al de la pantalla (diseño responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Links HTML</title>
    <!-- Ruta relativa: busca la carpeta css a partir de la ubicación de este archivo -->
    <link href="css/estilos.css" rel='stylesheet'/>
</head>
<!-- body: contenido visible de la página -->
<body>
    <!-- Encabezado principal -->
    <h1>Universidad HTML</h1>
    <!-- Salto de línea -->
    <br/>
    <!-- Ruta que empieza con "/": se calcula desde la raíz del sitio (no desde esta carpeta).
         Funciona cuando la página se abre desde un servidor web, por ejemplo Live Server -->
    <a href="/web/contenido.html">Ir a contenido</a>
    <br/>
    <!-- Ruta absoluta: dirección completa (protocolo + dominio) hacia otro sitio web -->
    <a href="http://globalmentoring.com.mx">Global Mentoring</a>
</body>
</html>
