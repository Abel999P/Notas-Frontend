<!DOCTYPE html>
<!-- La línea anterior declara que el documento usa HTML5 -->
<!-- Elemento raíz; lang indica el idioma del contenido -->
<html lang="en">
<!-- head: información de la página que no se muestra directamente -->
<head>
    <!-- Codificación de caracteres (permite acentos y ñ) -->
    <meta charset="UTF-8">
    <!-- Pide a Internet Explorer usar su motor de renderizado más reciente -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Ajusta el ancho de la página al de la pantalla (diseño responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Links HTML</title>
    <!-- Vincula la hoja de estilos que hace que el link se vea como un botón -->
    <link href="css/estilos.css" rel='stylesheet'/>
</head>
<!-- body: contenido visible de la página -->
<body>
    <!-- Encabezado principal -->
    <h1>Universidad HTML</h1>
    <!-- Salto de línea -->
    <br/>
    <!-- Link a otra página del sitio (ruta relativa).
         Gracias a estilos.css se muestra como un botón: fondo de color, padding y sin subrayado -->
    <a href="contenido.html">Ir a contenido</a>
</body>
</html>
