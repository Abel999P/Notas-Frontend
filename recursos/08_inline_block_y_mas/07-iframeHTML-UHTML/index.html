<!DOCTYPE html>
<!-- La línea anterior declara que el documento usa HTML5 -->
<!-- Elemento raíz; lang indica el idioma del contenido -->
<html lang="en">
<!-- head: información de la página que no se muestra directamente -->
<head>
    <!-- Codificación de caracteres (permite acentos y ñ) -->
    <meta charset="UTF-8">
    <!-- Pide a Internet Explorer usar su motor de renderizado más reciente -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Ajusta el ancho de la página al de la pantalla (diseño responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>iframe en HTML</title>
    <!-- Vincula la hoja de estilos externa /css/estilos.css -->
    <link href="/css/estilos.css" rel='stylesheet'/>
</head>
<!-- body: contenido visible de la página -->
<body>
    <!-- Encabezado principal (nivel 1) con la clase "titulo" -->
    <h1 class='titulo'>Uso de iframe en HTML</h1>
    
    <!-- Inserta otra página web dentro de esta (src es la dirección) con la clase "marco" -->
    <iframe src='texto.html' name='marco1' class="marco"></iframe>

    <!-- Contenedor de bloque (div) con la clase "centrar" -->
    <div class='centrar'>
        <!-- Link a un sitio externo (ruta absoluta) con la clase "boton" -->
        <a href="https://maps.app.goo.gl/zzZFnDXkf2pccXa67" target="marco1" class='boton'>
            Cargar Sitio 
        </a>
    </div>

</body>
</html>
