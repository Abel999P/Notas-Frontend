<!DOCTYPE html>
<!-- La línea anterior declara que el documento usa HTML5 -->
<!-- Elemento raíz; lang indica el idioma del contenido -->
<html lang="en">
<!-- head: información de la página que no se muestra directamente -->
<head>
    <!-- Codificación de caracteres (permite acentos y ñ) -->
    <meta charset="UTF-8">
    <!-- Pide a Internet Explorer usar su motor de renderizado más reciente -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Ajusta el ancho de la página al de la pantalla (diseño responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Elementos inline y block</title>
    <!-- Vincula la hoja de estilos externa /css/estilos.css -->
    <link href="/css/estilos.css" rel='stylesheet'/>
</head>
<!-- body: contenido visible de la página -->
<body>
    <!-- Encabezado principal (nivel 1) -->
    <h1>Elemento span (inline)</h1>
    <!-- Párrafo -->
    <p>Texto donde vamos a 
        <!-- Contenedor en línea (span) y estilo en línea (atributo style) -->
        <span style='color:#e63946;border: 1px solid black;'>enfatizar</span> 
        y cambiar el 
        <!-- Contenedor en línea (span) y estilo en línea (atributo style) -->
        <span style='color:#457b9d;font-weight: bold;'>
            color de algunos elementos
        </span></p>
     <h1>Elemento div (block)</h1>   
     <!-- Contenedor de bloque (div) -->
     <div>
         <!-- Encabezado de nivel 2 -->
         <h2>Título del div</h2>
         <p>Texto dentro del div</p>
     </div>
     <p>Texto fuera del div</p>
</body>
</html>
