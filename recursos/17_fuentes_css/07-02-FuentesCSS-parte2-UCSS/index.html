<!DOCTYPE html>
<!-- La línea anterior declara que el documento usa HTML5 -->
<!-- Elemento raíz; lang indica el idioma del contenido -->
<html lang="en">
<!-- head: información de la página que no se muestra directamente -->
<head>
    <!-- Codificación de caracteres (permite acentos y ñ) -->
    <meta charset="UTF-8">
    <!-- Pide a Internet Explorer usar su motor de renderizado más reciente -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Ajusta el ancho de la página al de la pantalla (diseño responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Fuentes en CSS</title>
    <!-- Vincula la hoja de estilos externa /css/estilos.css -->
    <link href="/css/estilos.css" rel="stylesheet"/>
</head>
<!-- body: contenido visible de la página -->
<body>
    <!-- Encabezado principal (nivel 1) -->
    <h1>Fuentes en CSS</h1>
    <!-- Contenedor de bloque (div) con las clases "caja serif" -->
    <div class="caja serif">
        <!-- Párrafo con la clase "fuente_times" -->
        <p class="fuente_times">Times New Roman <br/>(serif)</p>
    </div>
    <!-- Contenedor de bloque (div) con las clases "caja serif" -->
    <div class="caja serif">
        <!-- Párrafo con la clase "fuente_georgia" -->
        <p class="fuente_georgia">Fuente Georgia <br/>(serif)</p>
    </div>
    <!-- Contenedor de bloque (div) con las clases "caja sans-serif" -->
    <div class="caja sans-serif">
        <!-- Párrafo con la clase "fuente_arial" -->
        <p class="fuente_arial">Fuente Arial <br/>(sans-serif)</p>
    </div>
    <!-- Contenedor de bloque (div) con las clases "caja sans-serif" -->
    <div class="caja sans-serif">
        <!-- Párrafo con la clase "fuente_verdana" -->
        <p class="fuente_verdana">Fuente Verdana <br/>(sans-serif)</p>
    </div>
</body>
</html>
