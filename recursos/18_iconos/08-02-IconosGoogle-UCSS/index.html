<!DOCTYPE html>
<!-- La línea anterior declara que el documento usa HTML5 -->
<!-- Elemento raíz; lang indica el idioma del contenido -->
<html lang="en">
<!-- head: información de la página que no se muestra directamente -->
<head>
    <!-- Codificación de caracteres (permite acentos y ñ) -->
    <meta charset="UTF-8">
    <!-- Pide a Internet Explorer usar su motor de renderizado más reciente -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Ajusta el ancho de la página al de la pantalla (diseño responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Iconos en CSS</title>
    <!-- Carga la librería de íconos de Google -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Vincula la hoja de estilos externa /css/estilos.css -->
    <link href="/css/estilos.css" rel="stylesheet"/>
</head>
<!-- body: contenido visible de la página -->
<body>
    <!-- Encabezado principal (nivel 1) -->
    <h1> 
        <!-- Ícono de Google Material Icons (el texto de adentro indica cuál) con la clase "material-icons" -->
        <i class="material-icons">home</i>
        Iconos de Google</h1>
    <!-- Contenedor de bloque (div) -->
    <div>
        <!-- Párrafo -->
        <p>
            <i class="material-icons">search</i>
            Búsqueda
        </p>
    </div>
    <div>
        <p>
            <i class="material-icons icono_azul">done</i>
            Listo
        </p>
    </div>
    <div>
        <p>
            <i class="material-icons icono_rojo">arrow_right_alt</i>
            Flecha roja
        </p>
    </div>
</body>
</html>
