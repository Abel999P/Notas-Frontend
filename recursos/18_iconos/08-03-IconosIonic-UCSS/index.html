<!DOCTYPE html>
<!-- La línea anterior declara que el documento usa HTML5 -->
<!-- Elemento raíz; lang indica el idioma del contenido -->
<html lang="en">
<!-- head: información de la página que no se muestra directamente -->
<head>
    <!-- Codificación de caracteres (permite acentos y ñ) -->
    <meta charset="UTF-8">
    <!-- Pide a Internet Explorer usar su motor de renderizado más reciente -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Ajusta el ancho de la página al de la pantalla (diseño responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Iconos en CSS</title>
    <!-- Vincula la hoja de estilos externa /css/estilos.css -->
    <link href="/css/estilos.css" rel="stylesheet"/>
</head>
<!-- body: contenido visible de la página -->
<body>
    <!-- Encabezado principal (nivel 1) -->
    <h1> 
        <!-- Ícono de Ionicons (name indica cuál ícono se muestra) -->
        <ion-icon name="home-outline"></ion-icon>
        Iconos de Ionic</h1>
    <!-- Contenedor de bloque (div) -->
    <div>
        <!-- Párrafo -->
        <p>
            <ion-icon name="search-outline"></ion-icon>
            Búsqueda
        </p>
    </div>
    <div>
        <p>
            <ion-icon name="checkmark-done-outline" class="icono_azul" ></ion-icon>
            Listo
        </p>
    </div>
    <div>
        <p>
            <ion-icon name="arrow-forward-outline" class="icono_rojo"></ion-icon>
            Flecha roja
        </p>
    </div>

    <!-- Carga el archivo JavaScript https://unpkg.com/ionicons@5.4.0/dist/ionicons/ionicons.esm.js -->
    <script type="module" src="https://unpkg.com/ionicons@5.4.0/dist/ionicons/ionicons.esm.js"></script>
</body>
</html>
